---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  HUGO_VERSION: "0.162.1"

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.paths.outputs.app }}
      chart: ${{ steps.paths.outputs.chart }}
      docs-site: ${{ steps.paths.outputs.docs-site }}
      renovate: ${{ steps.paths.outputs.renovate }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changed paths
        id: paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            app:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Dockerfile'
            chart:
              - 'charts/**'
              - '.github/workflows/helm-lint.yml'
            docs-site:
              - 'README.md'
              - 'docs/assets/**'
              - 'docs/screenshots/**'
              - 'docs-site/**'
              - '.github/workflows/pages.yml'
              - '.github/workflows/ci.yaml'
            renovate:
              - '.github/renovate.json5'
              - '.github/workflows/ci.yaml'

  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: detect
    if: github.event_name == 'pull_request' && needs.detect.outputs.app == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify base images
        run: |
          DISTROLESS_REF=$(grep '^FROM gcr.io/distroless/' Dockerfile | awk '{print $2}')
          echo "Verifying ${DISTROLESS_REF}"
          cosign verify "${DISTROLESS_REF}" \
            --certificate-oidc-issuer https://accounts.google.com \
            --certificate-identity keyless@distroless.iam.gserviceaccount.com

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          annotations: |
            index:org.opencontainers.image.description=Extracts CRD JSON schemas from Kubernetes and publishes to Cloudflare Pages
            index:org.opencontainers.image.source=https://github.com/sholdee/crd-schema-publisher
            index:org.opencontainers.image.licenses=MIT
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=dev
            org.opencontainers.image.created=${{ github.event.pull_request.updated_at }}
          cache-from: type=gha,scope=crd-schema-publisher
          cache-to: type=gha,scope=crd-schema-publisher,mode=max,ignore-error=true

  renovate:
    needs: detect
    if: needs.detect.outputs.renovate == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Renovate config
        run: npx --yes --package renovate@44.33.2 -- renovate-config-validator --strict

  helm-lint:
    needs: detect
    if: needs.detect.outputs.chart == 'true'
    uses: ./.github/workflows/helm-lint.yml

  docs-site:
    needs: detect
    if: github.event_name != 'pull_request' || needs.detect.outputs.docs-site == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test docs site CSS
        run: node --test docs-site/assets/css/*.test.js

      - name: Install Hugo
        run: |
          set -euo pipefail
          curl -sL -o /tmp/hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir "${HOME}/hugo"
          tar -C "${HOME}/hugo" -xf /tmp/hugo.tar.gz
          echo "${HOME}/hugo" >> "${GITHUB_PATH}"

      - name: Build documentation site
        run: hugo --source docs-site --destination /tmp/crd-schema-publisher-docs-site --cleanDestinationDir --minify

  gate:
    runs-on: ubuntu-latest
    if: always()
    needs: [detect, test, build, renovate, helm-lint, docs-site]
    permissions: {}
    steps:
      - name: Evaluate results
        env:
          DETECT: ${{ needs.detect.result }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
          RENOVATE: ${{ needs.renovate.result }}
          HELM_LINT: ${{ needs.helm-lint.result }}
          DOCS_SITE: ${{ needs.docs-site.result }}
        run: |
          echo "detect=${DETECT} test=${TEST} build=${BUILD} renovate=${RENOVATE} helm-lint=${HELM_LINT} docs-site=${DOCS_SITE}"

          for result in "${DETECT}" "${TEST}" "${BUILD}" "${RENOVATE}" "${HELM_LINT}" "${DOCS_SITE}"; do
            if [[ "${result}" != "success" && "${result}" != "skipped" ]]; then
              echo "CI failed: job returned ${result}"
              exit 1
            fi
          done

          echo "CI passed"
