---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release-meta:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      date-tag: ${{ steps.version.outputs.date }}
      created: ${{ steps.version.outputs.created }}
      semver: ${{ steps.version.outputs.semver }}
    steps:
      - name: Verify branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "ERROR: Release workflow must run on main branch, got ${GITHUB_REF}"
          exit 1

      - name: Generate release metadata
        id: version
        run: |
          read -r YEAR MONTH DAY HOUR MINUTE SECOND < <(date -u '+%Y %m %d %H %M %S')
          MDD=$((10#${MONTH} * 100 + 10#${DAY}))
          HMMSS=$((10#${HOUR} * 10000 + 10#${MINUTE} * 100 + 10#${SECOND}))
          DATE_TAG="v${YEAR}.${MDD}.${HMMSS}"
          CREATED="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          {
            echo "date=${DATE_TAG}"
            echo "created=${CREATED}"
            echo "semver=${DATE_TAG#v}"
          } >> "$GITHUB_OUTPUT"

  test:
    needs: [release-meta]
    uses: ./.github/workflows/test.yml

  helm-lint:
    needs: [release-meta]
    uses: ./.github/workflows/helm-lint.yml

  binaries:
    needs: [test, release-meta]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      attestation-url: ${{ steps.attest.outputs.attestation-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Build binaries
        env:
          VERSION: ${{ needs.release-meta.outputs.date-tag }}
        run: |
          for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            goos="${pair%/*}"
            goarch="${pair#*/}"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
              go build -ldflags="-s -w -X main.version=${VERSION}" -o "dist/crd-schema-publisher-${goos}-${goarch}" ./cmd/
          done

      - name: Generate checksums
        run: |
          cd dist
          sha256sum crd-schema-publisher-* > checksums-sha256.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksum manifest
        run: |
          cosign sign-blob --yes \
            --bundle dist/checksums-sha256.txt.sigstore.json \
            dist/checksums-sha256.txt

      - name: Attest binaries
        id: attest
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-checksums: dist/checksums-sha256.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries
          path: dist/
          retention-days: 1

  build:
    needs: [test, release-meta]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify base images
        run: |
          DISTROLESS_REF=$(grep '^FROM gcr.io/distroless/' Dockerfile | awk '{print $2}')
          echo "Verifying ${DISTROLESS_REF}"
          cosign verify "${DISTROLESS_REF}" \
            --certificate-oidc-issuer https://accounts.google.com \
            --certificate-identity keyless@distroless.iam.gserviceaccount.com

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.release-meta.outputs.date-tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          annotations: |
            index:org.opencontainers.image.description=Extracts CRD JSON schemas from Kubernetes and publishes to Cloudflare Pages
            index:org.opencontainers.image.source=https://github.com/sholdee/crd-schema-publisher
            index:org.opencontainers.image.licenses=MIT
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.release-meta.outputs.date-tag }}
            org.opencontainers.image.created=${{ needs.release-meta.outputs.created }}
          cache-from: type=gha,scope=crd-schema-publisher
          cache-to: type=gha,scope=crd-schema-publisher,mode=max,ignore-error=true

  release-smoke:
    needs: [build, helm-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
      IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
      CF_PAGES_E2E_ACCOUNT_ID: ${{ secrets.CF_PAGES_E2E_ACCOUNT_ID }}
      CF_PAGES_E2E_API_TOKEN: ${{ secrets.CF_PAGES_E2E_API_TOKEN }}
      CF_PAGES_E2E_PROJECT: ${{ secrets.CF_PAGES_E2E_PROJECT }}
      RUN_MARKER: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
      MARKER_GROUP: smoke-${{ github.run_id }}-${{ github.run_attempt }}.ci.crd-schema-publisher.dev
      NAMESPACE: crd-schema-publisher-smoke-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate release smoke secrets
        run: |
          test -n "${CF_PAGES_E2E_ACCOUNT_ID}" || { echo "CF_PAGES_E2E_ACCOUNT_ID is required"; exit 1; }
          test -n "${CF_PAGES_E2E_API_TOKEN}" || { echo "CF_PAGES_E2E_API_TOKEN is required"; exit 1; }
          test -n "${CF_PAGES_E2E_PROJECT}" || { echo "CF_PAGES_E2E_PROJECT is required"; exit 1; }

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v4.2.0

      - name: Set up kubectl
        uses: Azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.36.1

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: v0.31.0
          kubectl_version: v1.36.1
          cluster_name: crd-schema-publisher-release-smoke
          wait: 120s

      - name: Run release smoke
        run: hack/release-smoke/validate.sh

  sign:
    needs: [build, release-smoke, release-meta]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign image with cosign
        env:
          FULL_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DATE_TAG: ${{ needs.release-meta.outputs.date-tag }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          cosign sign --yes "${FULL_IMAGE}:${DATE_TAG}@${DIGEST}"
          cosign sign --yes "${FULL_IMAGE}:latest@${DIGEST}"

  helm-package:
    needs: [helm-lint, sign, release-smoke, release-meta]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v4.2.0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package chart
        env:
          SEMVER: ${{ needs.release-meta.outputs.semver }}
          APP_VERSION: ${{ needs.release-meta.outputs.date-tag }}
        run: helm package charts/crd-schema-publisher --version "${SEMVER}" --app-version "${APP_VERSION}"

      - name: Push chart to GHCR
        env:
          SEMVER: ${{ needs.release-meta.outputs.semver }}
        run: helm push "crd-schema-publisher-${SEMVER}.tgz" "oci://${REGISTRY}/sholdee/charts"

      - name: Sign chart with cosign
        env:
          SEMVER: ${{ needs.release-meta.outputs.semver }}
        run: cosign sign --yes "${REGISTRY}/sholdee/charts/crd-schema-publisher:${SEMVER}"

  release:
    needs: [build, sign, helm-package, binaries, release-meta]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries
          path: dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATE_TAG: ${{ needs.release-meta.outputs.date-tag }}
          FULL_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ needs.build.outputs.digest }}
          ATTESTATION_URL: ${{ needs.binaries.outputs.attestation-url }}
        run: |
          git tag "${DATE_TAG}"
          git push origin "${DATE_TAG}"

          NOTES=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${DATE_TAG}" \
            --jq '.body')

          IMAGE_LINE="**Image:** \`${FULL_IMAGE}:${DATE_TAG}@${DIGEST}\`"
          CHART_LINE="**Chart:** \`oci://${REGISTRY}/sholdee/charts/crd-schema-publisher:${DATE_TAG#v}\`"
          CHECKSUM_LINE="**Checksums:** \`checksums-sha256.txt\` (Sigstore bundle: \`checksums-sha256.txt.sigstore.json\`)"
          PROVENANCE_LINE="**Binary provenance:** ${ATTESTATION_URL}"
          printf '%s\n\n---\n\n%s\n%s\n%s\n%s\n' "${NOTES}" "${IMAGE_LINE}" "${CHART_LINE}" "${CHECKSUM_LINE}" "${PROVENANCE_LINE}" \
            | gh release create "${DATE_TAG}" \
              --verify-tag \
              --title "${DATE_TAG}" \
              --notes-file - \
              dist/*
