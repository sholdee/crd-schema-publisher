---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Test

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Go toolchain pins
        run: bash hack/check-go-toolchain.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Lint workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint -shellcheck="shellcheck"

      - name: Lint installer script
        run: shellcheck scripts/install-crd-schema-publisher.sh

      - name: Lint markdown
        run: npx --yes markdownlint-cli2@0.23.2 '**/*.md' '#node_modules'

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

      - name: Verify dependencies
        run: go mod verify

      - name: Check go.mod tidiness
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run theme JS tests
        run: node --test theme/*.test.js

      - name: Run tests
        run: go test -race ./... -v -coverprofile=coverage.txt -covermode=atomic

      - name: Coverage summary
        run: go tool cover -func=coverage.txt

      - name: Run vet
        run: go vet ./...

      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
